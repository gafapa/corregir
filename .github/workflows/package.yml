name: Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          shared-key: installer
          cache-on-failure: true
      - name: Install pnpm
        run: npm install --global pnpm@10.12.4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify resources
        run: pnpm verify:resources
      - name: Test frontend
        run: pnpm test
      - name: Test backend
        working-directory: src-tauri
        run: cargo test --locked
      - name: Audit JavaScript dependencies
        run: pnpm audit
      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Install Rust audit tool
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: cargo audit
      - name: Build Windows NSIS installer
        run: pnpm tauri build --bundles nsis
      - name: Install and smoke-test packaged resources and startup
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          $installDirectory = Join-Path $env:RUNNER_TEMP 'corregir-installation-smoke'
          $installation = Start-Process -FilePath $installer.FullName -ArgumentList '/S',"/D=$installDirectory" -Wait -PassThru -WindowStyle Hidden
          if ($installation.ExitCode -ne 0) { throw "Installer failed: $($installation.ExitCode)" }
          $manifest = Get-Content (Join-Path $installDirectory 'manifest.json') -Raw | ConvertFrom-Json
          foreach ($resource in $manifest.resources) {
            $resourcePath = Join-Path $installDirectory $resource.path
            if ((Get-Item -LiteralPath $resourcePath).Length -ne $resource.size_bytes -or (Get-FileHash -LiteralPath $resourcePath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $resource.sha256) {
              throw "Installed resource failed verification: $($resource.path)"
            }
          }
          $application = Get-ChildItem -LiteralPath $installDirectory -Filter '*.exe' | Where-Object Name -NotMatch 'uninstall' | Select-Object -First 1
          if (!$application) { throw 'Installed application executable is missing' }
          $worker = [System.Diagnostics.Process]::new()
          $worker.StartInfo.FileName = $application.FullName
          $worker.StartInfo.ArgumentList.Add('--document-worker')
          $worker.StartInfo.UseShellExecute = $false
          $worker.StartInfo.CreateNoWindow = $true
          $worker.StartInfo.RedirectStandardInput = $true
          $worker.StartInfo.RedirectStandardOutput = $true
          $workerStarted = $false
          try {
            if (!$worker.Start()) { throw 'Packaged document worker did not start' }
            $workerStarted = $true
            $request = @{
              file_path = (Resolve-Path 'synthetic-data/language-student-1.pdf').Path
              pdfium_directory = Join-Path $installDirectory 'pdfium/bin'
              models_directory = Join-Path $installDirectory 'models/ocr'
              force_ocr = $false
            } | ConvertTo-Json -Compress
            $worker.StandardInput.WriteLine($request)
            $worker.StandardInput.Close()
            $output = $worker.StandardOutput.ReadToEndAsync()
            if (!$worker.WaitForExit(60000)) { throw 'Packaged document worker timed out' }
            if ($worker.ExitCode -ne 0) { throw 'Packaged document worker failed' }
            $messages = $output.GetAwaiter().GetResult().Split("`n", [System.StringSplitOptions]::RemoveEmptyEntries) | ForEach-Object { $_ | ConvertFrom-Json }
            $result = $messages | Where-Object kind -eq 'complete' | Select-Object -Last 1
            if (!$result -or $result.used_ocr -or $result.texts.Count -ne 1 -or $result.texts[0] -notmatch 'nostalgia') { throw 'Packaged document worker returned an unexpected result' }
          } finally {
            if ($workerStarted -and !$worker.HasExited) { $worker.Kill($true); $worker.WaitForExit() }
            $worker.Dispose()
          }
          $dataDirectory = Join-Path ([Environment]::GetFolderPath('ApplicationData')) 'com.corregir.desktop'
          $smokeOutput = Join-Path (Get-Location) 'output/installer-smoke'
          New-Item -ItemType Directory -Path $smokeOutput -Force | Out-Null
          foreach ($attempt in 1..2) {
            $stdoutPath = Join-Path $smokeOutput "startup-$attempt.stdout.log"
            $stderrPath = Join-Path $smokeOutput "startup-$attempt.stderr.log"
            $process = Start-Process -FilePath $application.FullName -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
            try {
              $deadline = [DateTime]::UtcNow.AddSeconds(90)
              do {
                Start-Sleep -Milliseconds 500
                $process.Refresh()
                if ($process.HasExited) { throw "Packaged application exited during startup: $($process.ExitCode)" }
              } while (!(Test-Path (Join-Path $dataDirectory 'corregir.sqlite.enc')) -and [DateTime]::UtcNow -lt $deadline)
              if (!(Test-Path (Join-Path $dataDirectory 'corregir.sqlite.enc'))) { throw 'Encrypted workspace was not created' }
              if (Test-Path (Join-Path $dataDirectory 'corregir.sqlite')) { throw 'Unexpected plaintext database' }
              Start-Sleep -Seconds 2
              $process.Refresh()
              if ($process.HasExited) { throw "Packaged application exited after startup: $($process.ExitCode)" }
            } finally {
              if (!$process.HasExited) {
                if (!$process.CloseMainWindow() -or !$process.WaitForExit(15000)) { Stop-Process -Id $process.Id -Force }
              }
            }
          }
      - name: Package no-install ZIP
        shell: pwsh
        run: ./scripts/package-portable.ps1 -SkipBuild
      - name: Verify relocated portable ZIP
        shell: pwsh
        run: |
          $archive = Get-ChildItem output/portable/*.zip | Select-Object -First 1
          ./scripts/verify-portable.ps1 -ArchivePath $archive.FullName
      - name: Verify password-protected work directory
        run: node scripts/verify-work-directory.cjs
      - name: Upload synthetic work-directory diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: synthetic-work-directory-diagnostics
          path: |
            output/work-directory-qualification/*/result.json
            output/work-directory-qualification/*/launch-failure.json
            output/work-directory-qualification/*/launch-*.log
            output/work-directory-qualification/*/*.png
            output/installer-smoke/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload portable ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: corregir-windows-x64-portable-unsigned
          path: |
            output/portable/*.zip
            output/portable/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: corregir-windows-x64-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
