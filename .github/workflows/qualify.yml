name: Windows desktop qualification
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: desktop-qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
      with:
        components: rustfmt
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: src-tauri
        shared-key: installer
    - name: Install pnpm
      run: npm install --global pnpm@10.12.4
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Verify resources
      run: pnpm verify:resources
    - name: Test frontend
      run: pnpm test
    - name: Test backend
      working-directory: src-tauri
      run: cargo test --locked
    - name: Qualify installed desktop and upgrade
      shell: pwsh
      run: ./scripts/qualify-windows.ps1
    - name: Upload synthetic qualification evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: desktop-qualification-evidence
        path: output/desktop-qualification/
        retention-days: 7
        if-no-files-found: warn
